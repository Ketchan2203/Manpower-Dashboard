<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manpower & Shift Simulation — Injection Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --charcoal:#36454F; --charcoal-dk:#262F36;
  --offwhite:#F2F2F2; --paper:#FAFBFB;
  --red:#D71920; --red-dk:#B5141A;
  --green:#2E7D52; --green-bg:#E7F3EC;
  --amber:#C9821A; --amber-bg:#FBF1E1;
  --blue:#2C5E8A; --blue-bg:#E7EFF6;
  --white:#FFFFFF; --grey-txt:#5B6670; --border:#DADFE3;
  --factory-green:#1E5631; --factory-green-dk:#153F24;
  --zone-cream:#F5F0DA; --zone-mint:#E9F3EA; --zone-border:#6B1F22;
  --font-head:'Space Grotesk','Noto Sans Thai',sans-serif;
  --font-body:'Inter','Noto Sans Thai',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--paper);color:var(--charcoal);-webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;}

/* Header */
header.app-head{
  background:var(--charcoal-dk); color:var(--white);
  padding:16px 22px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:8px; border-bottom:3px solid var(--red);
}
.app-head .brand{display:flex;align-items:center;gap:10px;}
.app-head .sq{width:13px;height:13px;background:var(--red);flex:none;}
.app-head h1{font-family:var(--font-head);font-size:17px;margin:0;font-weight:700;}
.app-head .sub{font-size:11.5px;color:#B7C0C8;margin-top:2px;}
.app-head .meta{font-size:11px;color:#9AA3AB;text-align:right;line-height:1.5;}
.lang-switch{display:flex;border:1.5px solid #4A5560;border-radius:7px;overflow:hidden;}
.lang-switch button{background:transparent;border:none;color:#C7CCD1;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.lang-switch button.active{background:var(--red);color:#fff;}

nav.tabs{display:flex;background:var(--charcoal);padding:0 22px;gap:2px;overflow-x:auto;}
nav.tabs button{
  background:transparent;border:none;color:#C7CCD1;padding:12px 16px;font-size:12.8px;font-weight:600;
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;
}
nav.tabs button:hover{background:rgba(255,255,255,0.06);}
nav.tabs button.active{color:#fff;border-bottom-color:var(--red);background:rgba(255,255,255,0.04);}
nav.tabs button .tag{font-family:var(--font-head);font-size:9.5px;color:var(--red);background:rgba(215,25,32,.15);padding:2px 6px;border-radius:3px;}

main.tabpanels{padding:18px 20px 60px;max-width:1500px;margin:0 auto;}
.tabsection{display:none;} .tabsection.active{display:block;}

.summary-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
@media (max-width:900px){.summary-bar{grid-template-columns:repeat(2,1fr);}}
.summary-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:11px 13px;}
.summary-card .lbl{font-size:10px;color:var(--grey-txt);text-transform:uppercase;letter-spacing:.4px;}
.summary-card .big{font-family:var(--font-head);font-size:22px;font-weight:700;margin-top:2px;}
.summary-card .big.danger{color:var(--red);} .summary-card .big.ok{color:var(--green);} .summary-card .big.amber{color:var(--amber);}
.summary-card .sub{font-size:10px;color:#8A939B;margin-top:2px;}

/* ---------- Floor plan ---------- */
.floor-toolbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
#pool-tray-wrap{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
#pool-tray-wrap h4{margin:0 0 6px;font-family:var(--font-head);font-size:11.5px;text-transform:uppercase;color:var(--grey-txt);letter-spacing:.5px;}
#pool-tray{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;background:var(--offwhite);border:2px dashed var(--border);border-radius:7px;}
#pool-tray.empty::after{content:"ลากคนกลับมาไว้ตรงนี้ได้";font-size:11px;color:#9AA3AB;align-self:center;}

.factory-floor-canvas{
  position:relative;
  background:var(--factory-green);
  border:4px solid var(--factory-green-dk);
  border-radius:10px;
  overflow:auto;
  min-height:400px;
}
.canvas-zoom-sizer{ position:relative; }
.canvas-zoom-content{ transform-origin: 0 0; position:absolute; top:0; left:0; }
.zoom-toolbar{
  display:flex; align-items:center; gap:8px; margin-bottom:8px; background:#fff; border:1px solid var(--border);
  border-radius:8px; padding:6px 10px; width:fit-content;
}
.zoom-toolbar button{
  width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--offwhite);
  font-size:16px; font-weight:700; cursor:pointer; color:var(--charcoal); display:flex; align-items:center; justify-content:center;
}
.zoom-toolbar button:hover{background:var(--charcoal); color:#fff;}
.zoom-toolbar .zoom-pct{font-family:var(--font-head); font-weight:700; font-size:12.5px; min-width:44px; text-align:center;}
.floor-block{display:flex;flex-direction:column;gap:12px;}

.zone-box{
  background:var(--zone-cream);
  border:2px solid var(--zone-border);
  border-radius:6px;
  padding:10px;
  min-width:280px; min-height:140px; height:100%; box-sizing:border-box; position:relative;
}
.zone-box.support{background:var(--zone-mint);}
.zone-title{font-family:var(--font-head);font-size:11px;font-weight:700;color:var(--zone-border);margin-bottom:8px;letter-spacing:.3px;}
.zone-machines{display:flex;flex-wrap:wrap;gap:8px;}

.machine-tile{
  width:150px;
  background:var(--white);
  border:1.5px solid #B9C0C6;
  border-radius:7px;
  padding:6px 6px 24px;
  position:relative;
  cursor:pointer;
  transition:box-shadow .12s, border-color .12s;
}
.ot-sat-badge{
  position:absolute; top:2px; right:2px; background:var(--red); color:#fff;
  font-size:8px; font-weight:800; padding:2px 5px; border-radius:4px; z-index:2;
  letter-spacing:.2px;
}
.shift-split{display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:4px;}
.shift-col{background:var(--offwhite); border-radius:5px; padding:3px;}
.shift-col-lbl{font-size:8.5px; font-weight:700; text-align:center; color:var(--grey-txt); margin-bottom:2px;}
.shift-drop{min-height:26px;}
.tile-drag-handle{
  position:absolute; top:2px; left:2px; width:16px; height:14px; cursor:grab;
  font-size:11px; line-height:14px; text-align:center; color:#9AA3AB; border-radius:3px;
  touch-action:none; z-index:2;
}
.tile-drag-handle:hover{background:var(--offwhite); color:var(--charcoal);}
.zone-machines.dragover{outline:2px dashed var(--red); border-radius:8px;}
.region-item{position:absolute; resize:both; overflow:auto; box-shadow:0 3px 10px rgba(0,0,0,.25); border-radius:8px;}
.region-drag-handle{
  position:absolute; top:6px; right:6px; width:20px; height:16px; cursor:grab;
  font-size:9px; line-height:16px; text-align:center; color:#9AA3AB; border-radius:3px;
  touch-action:none; z-index:3; letter-spacing:-2px; background:rgba(255,255,255,.7);
}
.region-drag-handle:hover{background:var(--offwhite); color:var(--charcoal);}
.support-tile.banner{width:100%;}
.machine-tile:hover{box-shadow:0 2px 8px rgba(0,0,0,.18);border-color:var(--charcoal);}
.machine-tile.status-critical{border-color:var(--red);box-shadow:0 0 0 2px rgba(215,25,32,.18);}
.machine-tile.status-shared{border-color:var(--amber);}
.machine-tile.status-ok{border-color:var(--green);}
.machine-tile.status-decommissioned{opacity:.42;}
.machine-tile .mid{font-family:var(--font-head);font-size:11.5px;font-weight:700;text-align:center;}
.machine-tile .glyph{
  width:100%;height:34px;margin:4px 0;
  background:repeating-linear-gradient(180deg,#8FA0AC 0 4px,#AAB8C2 4px 8px);
  border-radius:3px;position:relative;
}
.machine-tile .slot-drop{min-height:30px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;}
.machine-tile .slot-drop.dragover{outline:2px dashed var(--red);border-radius:5px;}
.machine-tile .badges{position:absolute;top:3px;right:3px;display:flex;gap:2px;}
.machine-tile .badge-dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.25);}
.machine-tile .badge-dot.fix{background:var(--red);}
.machine-tile .badge-dot.move{background:#5FBF6E;}
.machine-tile .no-relief{font-size:8.5px;color:var(--amber);margin-top:3px;text-align:center;}
.machine-tile .decom-x{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--red);pointer-events:none;font-weight:900;
}
.machine-tile .shifts-pill{
  position:absolute; left:0; right:0; bottom:0;
  font-size:10.5px; font-family:var(--font-head); font-weight:800;
  padding:3px 4px; text-align:center; border-radius:0 0 6px 6px;
  letter-spacing:.2px;
}
.machine-tile .shifts-pill.shift-2{ background:#1857A4; color:#fff; }
.machine-tile .shifts-pill.shift-1{ background:#E8A020; color:#3A2405; }
.machine-tile .shifts-pill.shift-mixed{ background:#8B5CF6; color:#fff; }

.support-tile{
  min-width:120px;flex:1;
  background:var(--white); border:1.5px solid #B9C0C6; border-radius:7px; padding:8px; position:relative;
}
.labor-badge{
  display:inline-block; font-size:8.5px; font-weight:800; padding:2px 7px; border-radius:8px;
  letter-spacing:.3px; margin-bottom:5px;
}
.labor-badge.direct{background:#1857A4; color:#fff;}
.labor-badge.indirect{background:#C9631A; color:#fff;}
.custom-area-box{
  border:2px dashed #999; border-radius:6px; padding:10px; min-width:220px; min-height:100px; height:100%; box-sizing:border-box;
}
.support-tile .stitle{font-size:11px;font-weight:700;margin-bottom:5px;}
.support-tile .slot-drop{min-height:34px;display:flex;flex-wrap:wrap;gap:4px;}

/* Chips */
.chip{
  background:var(--white); border:1.5px solid var(--charcoal); border-radius:14px;
  padding:3px 8px 3px 4px; font-size:10.5px; font-weight:600; display:inline-flex; align-items:center; gap:4px;
  cursor:grab; touch-action:none; user-select:none; transition:box-shadow .12s;
}
.chip .dot{width:14px;height:14px;border-radius:50%;background:var(--charcoal);color:#fff;font-size:7px;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-head);flex:none;}
.chip:hover{box-shadow:0 2px 6px rgba(0,0,0,.15);}
.chip.selected{border-color:var(--red);box-shadow:0 0 0 2px rgba(215,25,32,.25);}
.chip.dragging{opacity:.35;}
.chip.small{font-size:9px;padding:2px 6px 2px 3px;}
.chip.small .dot{width:12px;height:12px;font-size:6px;}
.chip-ghost{position:fixed;pointer-events:none;z-index:999;opacity:.92;transform:translate(-50%,-50%) scale(1.05);}

.legend-box{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11.5px;align-self:flex-start;height:auto;}
.legend-box h4{margin:0 0 8px;font-family:var(--font-head);font-size:11px;text-transform:uppercase;color:var(--grey-txt);}
.legend-row{display:flex;align-items:center;gap:7px;padding:3px 0;}
.legend-row .sw{width:11px;height:11px;border-radius:50%;flex:none;}

/* Detail panel (slide-over) */
#overlay{position:fixed;inset:0;background:rgba(20,25,28,.45);z-index:50;display:none;}
#overlay.open{display:block;}
#detail-panel{
  position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:#fff;z-index:51;
  box-shadow:-8px 0 24px rgba(0,0,0,.25); transform:translateX(100%); transition:transform .2s ease;
  overflow-y:auto; padding:20px;
}
#detail-panel.open{transform:translateX(0);}
#detail-panel h2{font-family:var(--font-head);font-size:20px;margin:0 0 2px;}
#detail-panel .close-btn{position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--grey-txt);}
.dp-section{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
.dp-section h4{font-family:var(--font-head);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--grey-txt);margin:0 0 8px;}
.dp-row{margin-bottom:10px;}
.dp-row label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;}
.dp-row input[type=text],.dp-row input[type=date],.dp-row select{
  width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;
}
.toggle-btns{display:flex;gap:6px;}
.toggle-btns button{
  flex:1;padding:8px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;
}
.toggle-btns button.active-fix{background:var(--red);color:#fff;border-color:var(--red);}
.toggle-btns button.active-move{background:var(--green);color:#fff;border-color:var(--green);}
.toggle-btns button.active-none{background:var(--charcoal);color:#fff;border-color:var(--charcoal);}
.dp-checkbox{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;}
.relief-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px dashed var(--border);}
.relief-row:last-child{border-bottom:none;}

/* Production plan table */
.plan-table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:8px;}
table.plan-table{border-collapse:collapse;width:100%;font-size:12px;}
table.plan-table th,table.plan-table td{padding:6px 8px;text-align:center;border-top:1px solid var(--border);white-space:nowrap;}
table.plan-table thead th{background:var(--charcoal);color:#fff;position:sticky;top:0;}
table.plan-table td.mname{text-align:left;font-weight:700;position:sticky;left:0;background:#fff;}
.shift-btn{width:34px;height:26px;border-radius:5px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:11px;cursor:pointer;}
.shift-btn.s1{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}
.shift-btn.s2{background:#FDE9E9;border-color:var(--red);color:var(--red);}
.shift-btn:disabled{opacity:.35;cursor:not-allowed;}
.bulk-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:12px;}
.bulk-row button{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:11.5px;font-weight:600;}

/* Skill matrix */
.station-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.risk-card{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:10px 11px;}
.risk-card.spof{border-color:var(--red);}
.risk-card .mname{font-family:var(--font-head);font-weight:700;font-size:13px;}
.risk-card .rtxt{font-size:11px;color:var(--grey-txt);margin-top:4px;}
.status-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;}
.status-pill.ok{background:var(--green-bg);color:var(--green);}
.status-pill.over,.status-pill.critical{background:#FBE2E3;color:var(--red);}
.status-pill.shared{background:var(--amber-bg);color:var(--amber);}

/* Roster */
.roster-toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--border);padding:10px 14px;border-radius:8px;}
.roster-toolbar label{font-size:12px;font-weight:700;}
.roster-toolbar input[type=date]{padding:6px 8px;border:1px solid var(--border);border-radius:6px;}
.rweek-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-bottom:10px;}
.rweek-cal .dayhead{background:var(--charcoal);color:#fff;text-align:center;padding:8px 4px;font-family:var(--font-head);font-weight:700;font-size:12px;}
.rweek-cal .dayhead.sun{background:var(--red);}
.rweek-cal .dayhead.sat{background:var(--blue);}
.worker-week-card{background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;}
.wwc-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--offwhite);}
.wwc-head b{font-family:var(--font-head);}
.wwc-days{display:grid;grid-template-columns:repeat(7,1fr);}
.wwc-day{border-left:1px solid var(--border);padding:8px 6px;text-align:center;}
.wwc-day:first-child{border-left:none;}
.wwc-day .lbl{font-size:9.5px;color:var(--grey-txt);}
.wwc-day .basehr{font-size:10.5px;margin-top:2px;}
.wwc-day .otwrap{margin-top:4px;display:flex;align-items:center;justify-content:center;gap:3px;}
.wwc-day .otwrap input{width:38px;padding:2px 3px;font-size:10.5px;border:1px solid var(--border);border-radius:4px;text-align:center;}
.wwc-day .daytot{font-family:var(--font-head);font-weight:700;font-size:12px;margin-top:4px;}
.wwc-day.off{background:#F5F5F5;color:#B0B6BB;}
.wwc-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px dashed var(--border);}
.wwc-foot .tothrs{font-family:var(--font-head);font-size:16px;font-weight:700;}
.pass-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;}
.pass-badge.pass{background:var(--green-bg);color:var(--green);}
.pass-badge.fail{background:#FBE2E3;color:var(--red);}

.hint{font-size:11px;color:#8A939B;}
.panel{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px;}
.slider-row label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px;}
.slider-row .val{font-family:var(--font-head);color:var(--red);font-weight:700;}
.slider-row input[type=range]{width:100%;accent-color:var(--red);}
.reset-btn{background:var(--charcoal);color:#fff;border:none;padding:7px 12px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;height:34px;line-height:20px;box-sizing:border-box;}
.group-label{font-family:var(--font-head);font-size:13px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
.group-label::after{content:"";flex:1;height:1px;background:var(--border);}
footer.app-foot{text-align:center;font-size:11px;color:#9AA3AB;padding:16px;border-top:1px solid var(--border);}

/* ============================================================
   MOBILE RESPONSIVENESS
   ============================================================ */
@media (max-width:900px){
  main.tabpanels{padding:14px 12px 50px;}
  .app-head{padding:12px 14px;}
  .app-head h1{font-size:15px;}
  .app-head .sub{font-size:10.5px;}
  .app-head .meta{display:none;}
  #scenario-btn{padding:8px 10px;font-size:11px;}
  nav.tabs{padding:0 10px;}
  nav.tabs button{padding:11px 12px;font-size:12px;}
}
@media (max-width:480px){
  nav.tabs button span:not(.tag){display:none;}
  nav.tabs button{padding:12px 10px;}
}
@media (max-width:640px){
  .app-head{flex-direction:column;align-items:flex-start;gap:10px;}
  .app-head > div:last-child{width:100%;justify-content:space-between;display:flex;}
  .lang-switch button{padding:8px 10px;}
  .floor-toolbar{flex-direction:column;}
  #pool-tray-wrap,#jig-tray-wrap,.legend-box{min-width:0 !important;width:100%;}
  .summary-bar{grid-template-columns:repeat(2,1fr) !important;}
  .chip-settings-btn{width:24px;height:24px;font-size:13px;}
  .avatar-chip{padding:5px 10px 5px 4px;}
  .avatar-circle{width:28px;height:28px;}
  .avatar-circle svg{width:18px;height:18px;}
  input[type=color]{width:26px !important;height:26px !important;}
  .machine-tile{width:150px;}
  .zone-title input[type=color]{width:26px;height:26px;}
  .shift-btn{width:38px;height:32px;font-size:13px;}
  .ot-input{width:44px !important;height:24px !important;font-size:12px !important;}
  .wwc-days{grid-template-columns:repeat(7,66px); overflow-x:auto;}
  .wwc-day{min-width:66px;}
  #detail-panel{width:100%;max-width:100%;padding:16px;}
  .toggle-btns button{padding:11px 6px;font-size:11px;}
  table.plan-table th,table.plan-table td{padding:8px 6px;}
  .factory-floor-canvas{-webkit-overflow-scrolling:touch;}

(function(){

/* ============================================================

const ICONS = {

/* Bilingual helper: T('ไทย','English') -> returns the right one for state.lang */
function T(th,en){ return (state && state.lang==='en') ? en : th; }
function dayLabelsShort(){ return state.lang==='en' ? DAY_LABELS_SHORT_EN : DAY_LABELS_SHORT; }
function breakGroupLabel(g){ const grp=BREAK_GROUPS[g]; if(!grp) return ''; return state.lang==='en' ? grp.labelEn : grp.label; }

/* Simple original cartoon-avatar face SVGs (head+shoulders), inspired by round icon-badge style */
const AVATAR_FACES = {
  m1: '<circle cx="12" cy="9.5" r="4" fill="#3A2E28"/><circle cx="12" cy="9.8" r="3.3" fill="#F4C29A"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="#fff"/>',
  f1: '<path d="M6.2 9.5a5.8 5.8 0 0 1 11.6 0c0 2-.5 4-1 5.2-1 .3-2 1.3-2 1.3H9.2s-1-1-2-1.3c-.5-1.2-1-3.2-1-5.2z" fill="#3A2416"/><circle cx="12" cy="10.3" r="3.4" fill="#F4C29A"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="#fff"/>',
  m2: '<circle cx="12" cy="9.7" r="3.6" fill="#F4C29A"/><path d="M5.5 9.5c0-4 3-6 6.5-6s6.5 2 6.5 6c-1.5.3-2-1.5-2-1.5s-2 1-4.5 1-4.5-1-4.5-1-.5 1.8-2 1.5z" fill="#2B2320"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="#fff"/>',
  f2: '<circle cx="12" cy="10" r="3.5" fill="#F4C29A"/><path d="M4.5 10c0-5 3.2-8 7.5-8s7.5 3 7.5 8c-1 1-1.6-.5-1.6-2 0 0-2 1.3-5.9 1.3S6.1 8 6.1 8c0 1.5-.6 3-1.6 2z" fill="#4A2E1A"/><path d="M3.6 21c0-4.4 3.7-7 8.4-7s8.4 2.6 8.4 7" fill="#fff"/>'

const MACHINE_ICON_SVG = `

  <rect x="16" y="12" width="28" height="8" fill="#0F172A"/>
  <rect x="12" y="20" width="36" height="26" fill="#1E3A5F"/>
  <rect x="18" y="24" width="8" height="18" fill="#3E566E"/>
  <rect x="30" y="24" width="8" height="18" fill="#3E566E"/>
  <rect x="6" y="48" width="48" height="6" fill="#0F172A"/>
  <rect x="0" y="54" width="60" height="10" fill="#EDEDED" stroke="#B9C0C6"/>
  <rect x="12" y="64" width="36" height="14" fill="#B9D4D8"/>
  <circle cx="30" cy="71" r="5" fill="#fff" stroke="#8FA0AC"/>
  <rect x="10" y="78" width="40" height="8" fill="#123A63"/>
  <rect x="10" y="86" width="40" height="30" fill="#1857A4"/>
  <rect x="10" y="112" width="40" height="4" fill="#0F3D73"/>
</svg>`;

/* ============================================================
   DATA MODEL — Injection Line Manpower Simulation v2
   ============================================================ */

// Each machine: id, side(left/right), zone(A/B/C/R1/R2/R3), col order within its row
const MACHINES = [
  // ---- LEFT BLOCK ----
  // A Zone (top row)
  {id:'450T-1', side:'L', zone:'A', row:1},
  {id:'650T-1', side:'L', zone:'A', row:1},
  {id:'850T-1', side:'L', zone:'A', row:1},
  // B Zone (middle row)
  {id:'350T-8', side:'L', zone:'B', row:1},
  {id:'350T-7', side:'L', zone:'B', row:1},
  {id:'350T-6', side:'L', zone:'B', row:1},
  {id:'350T-5', side:'L', zone:'B', row:1},
  {id:'350T-4', side:'L', zone:'B', row:1},
  {id:'350T-2', side:'L', zone:'B', row:1},
  // C Zone (bottom row)
  {id:'230T-1', side:'L', zone:'C', row:1},
  {id:'180T-1', side:'L', zone:'C', row:1},
  {id:'180T-2', side:'L', zone:'C', row:1},
  {id:'180T-3', side:'L', zone:'C', row:1},
  {id:'220T-1', side:'L', zone:'C', row:1},
  {id:'220T-2', side:'L', zone:'C', row:1},
  {id:'220T-3', side:'L', zone:'C', row:1},
  // ---- RIGHT BLOCK ----
  // Top row (mirrors A)
  {id:'450T-2', side:'R', zone:'R1', row:1},
  {id:'450T-3', side:'R', zone:'R1', row:1},
  {id:'450T-4', side:'R', zone:'R1', row:1},
  // Middle row (mirrors B)
  {id:'350T-3', side:'R', zone:'R2', row:1},
  {id:'350T-1', side:'R', zone:'R2', row:1},
  {id:'350T-9', side:'R', zone:'R2', row:1},
  {id:'350T-10', side:'R', zone:'R2', row:1},
  // Bottom row (mirrors C)
  {id:'180T-4', side:'R', zone:'R3', row:1},
  {id:'220T-4', side:'R', zone:'R3', row:1},
];

const ZONE_LABELS = {
  A:'A Zone', B:'B Zone', C:'C Zone',
  R1:'2nd M/C Zone (บน)', R2:'2nd M/C Zone (กลาง)', R3:'2nd M/C Zone (ล่าง)'
};

// Support (non-machine) work zones — droppable, simpler (operator pool only)
// laborType: 'direct' = คนที่ผลิต/ประกอบชิ้นงานโดยตรง, 'indirect' = คนสนับสนุนการผลิต
const SUPPORT_ZONES = [
  {id:'materialctrl2f', side:'L', label:'2nd Floor: Material Control', baseReq:4, banner:true, laborType:'indirect'},
  {id:'boxservice',  side:'L', label:'Box service',            baseReq:2, laborType:'indirect'},
  {id:'wip',         side:'R', label:'WIP',                    baseReq:0, laborType:'indirect'},
  {id:'secondpool',  side:'R', label:'2nd Process (ส่วนกลาง)', baseReq:3, isBreakPool:true, laborType:'direct'},
  {id:'qcout',       side:'R', label:'QC Outgoing',            baseReq:2, laborType:'indirect'},
  {id:'matreceive',  side:'R', label:'Material receiving area',baseReq:2, laborType:'indirect'},
  {id:'moldstorage1',side:'L', label:'Mold Storage Area',      baseReq:0, laborType:'indirect'},
  {id:'moldmaint',   side:'R', label:'Mold Maintenance (KE Shop)', baseReq:3, laborType:'indirect'},
  {id:'moldstorage2',side:'R', label:'Mold Storage Area',      baseReq:0, laborType:'indirect'},
  {id:'wiparea',     side:'R', label:'WIP Area',                baseReq:0, laborType:'indirect'},
  {id:'machmaint',   side:'R', label:'Machine Maintenance',     baseReq:4, laborType:'indirect'},
  {id:'cmmroom',     side:'R', label:'CMM Room',                 baseReq:4, laborType:'indirect'},
];

const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS_TH = ['จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์'];
const DAY_LABELS_SHORT = ['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
const DAY_LABELS_SHORT_EN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// Hour model (RMT Connect style)
const BASE_HOURS_PER_SHIFT = 8.58; // 8h + 35min break counted as 0.58
const MAX_OT_PER_DAY = 4;
const RBA_WEEKLY_CAP = 60;

const BREAK_SLOTS_DEFAULT = [
  {id:'b1', label:'พักเบรกช่วงเช้า'},
  {id:'b2', label:'พักกลางวัน'},
  {id:'b3', label:'พักเบรกช่วงบ่าย'}
];

/* ============================================================
   BREAK GROUPS — 3 กลุ่มพัก (เขียว/ส้ม/เหลือง) พร้อมเวลาจริง
   จากบัตรพนักงาน "Part Manufacturing" ผลิต 1/2/3
   ============================================================ */
const BREAK_GROUPS = {
  green:  { id:'green',  label:'เบลก1', labelEn:'Break 1', color:'#2E7D52', bg:'#E7F3EC',
    day:   [{n:'1st time', s:'10:00', e:'10:10'}, {n:'2nd time', s:'11:00', e:'11:45'}, {n:'3rd time', s:'15:00', e:'15:10'}, {n:'OT time', s:'16:45', e:'17:10'}],
    night: [{n:'1st time', s:'22:00', e:'22:10'}, {n:'2nd time', s:'23:45', e:'00:30'}, {n:'3rd time', s:'03:00', e:'03:10'}, {n:'OT time', s:'05:05', e:'05:30'}]
  },
  orange: { id:'orange', label:'เบลก2', labelEn:'Break 2', color:'#C9631A', bg:'#FBEEE1',
    day:   [{n:'1st time', s:'10:10', e:'10:20'}, {n:'2nd time', s:'11:45', e:'12:30'}, {n:'3rd time', s:'15:10', e:'15:20'}, {n:'OT time', s:'17:10', e:'17:35'}],
    night: [{n:'1st time', s:'22:15', e:'22:25'}, {n:'2nd time', s:'00:35', e:'01:20'}, {n:'3rd time', s:'03:15', e:'03:25'}, {n:'OT time', s:'05:35', e:'06:00'}]
  },
  yellow: { id:'yellow', label:'เบลก3', labelEn:'Break 3', color:'#B8960C', bg:'#FBF6DE',
    day:   [{n:'1st time', s:'10:20', e:'10:30'}, {n:'2nd time', s:'12:30', e:'13:15'}, {n:'3rd time', s:'15:20', e:'15:30'}, {n:'OT time', s:'17:35', e:'18:00'}],
    night: [{n:'1st time', s:'22:30', e:'22:40'}, {n:'2nd time', s:'01:25', e:'02:10'}, {n:'3rd time', s:'03:30', e:'03:40'}, {n:'OT time', s:'06:05', e:'06:30'}]
  }
};
const BREAK_GROUP_ORDER = ['green','orange','yellow'];
const MAX_MACHINES_PER_WORKER = 3;

/* ============================================================
   STATE + CALCULATIONS — v3
   ============================================================ */
let state = null;

const AVATAR_STYLES = ['m1','f1','m2','f2'];
const WORKER_COLOR_PALETTE = [
  '#4C6EF5','#F76707','#0CA678','#E64980','#7048E8','#1098AD',
  '#F59F00','#37B24D','#E03131','#5C7CFA','#12B886','#D6336C',
  '#845EF7','#228BE6','#F08C00','#2F9E44','#C2255C','#3B5BDB'
];

function initWorkers(){
  const sharedPairs = [['650T-1','850T-1'], ['350T-8','350T-7'], ['350T-6','350T-5'], ['350T-4','350T-2'],
                        ['180T-1','180T-2'], ['220T-1','220T-2'], ['450T-3','450T-4'],
                        ['350T-3','350T-1'], ['350T-9','350T-10'], ['180T-4','220T-4']];
  const covered = new Set();
  const groups = [];
  sharedPairs.forEach(pair=>{ groups.push(pair); pair.forEach(m=>covered.add(m)); });
  MACHINES.forEach(m=>{ if(!covered.has(m.id)) groups.push([m.id]); });

  const workers = [];
  let n = 1;
  function mk(slots, role){
    const id = 'W'+String(n).padStart(2,'0');
    const gcolor = BREAK_GROUP_ORDER[(n-1)%3];
    const avatar = AVATAR_STYLES[(n-1)%AVATAR_STYLES.length];
    const color = WORKER_COLOR_PALETTE[(n-1)%WORKER_COLOR_PALETTE.length];
    n++;
    workers.push({ id, name:id, slots: slots?slots.slice():[], role: role||'operator', breakGroup: gcolor, avatar, color, shiftAssign:{}, reliefFor:null });
    return id;
  }
  groups.forEach((grp,idx)=>{
    if(idx < groups.length-2){ mk(grp, 'operator'); }
  });
  SUPPORT_ZONES.forEach(z=>{
    const n2 = Math.max(0, z.baseReq - (z.baseReq>2?1:0));
    for(let i=0;i<n2;i++) mk([z.id], 'support');
  });
  for(let i=0;i<6;i++) mk([], 'operator');
  return workers;
}

function defaultProductionPlan(){
  const plan = {};
  MACHINES.forEach(m=>{
    plan[m.id] = {};
    DAY_KEYS.forEach(d=>{ plan[m.id][d] = (d==='sat'||d==='sun') ? 1 : 2; });
  });
  return plan;
}

function defaultMachineMeta(){
  const meta = {};
  MACHINES.forEach(m=>{ meta[m.id] = { decommission:{flag:false, note:'', date:''} }; });
  return meta;
}

function defaultLabels(){
  const machine = {}; MACHINES.forEach(m=>machine[m.id]=m.id);
  const zone = {...ZONE_LABELS};
  const support = {}; SUPPORT_ZONES.forEach(z=>support[z.id]=z.label);
  return { machine, zone, support };
}

function defaultZoneOrder(){
  const order = {};
  ['A','B','C','R1','R2','R3'].forEach(zk=>{ order[zk] = MACHINES.filter(m=>m.zone===zk).map(m=>m.id); });
  return order;
}
function defaultBlockItems(){
  return {
    L: ['support:materialctrl2f','support:boxservice','zone:A','support:moldstorage1','zone:B','zone:C'],
    R: ['support:wip','support:secondpool','support:qcout','support:matreceive','support:moldmaint',
        'zone:R1','support:moldstorage2','support:wiparea','support:machmaint','zone:R2','zone:R3','support:cmmroom']
  };
}
function allRegionKeysDefault(){
  const b = defaultBlockItems();
  return [...b.L, ...b.R];
}
function defaultRegionPos(){
  const pos = {};
  const colX = { L: 20, R: 700 };
  const colW = 660;
  const supportH = 100, gap = 14;
  ['L','R'].forEach(side=>{
    let y = 20;
    defaultBlockItems()[side].forEach(key=>{
      const [kind,id] = key.split(':');
      if(kind==='support'){
        pos[key] = { x: colX[side], y, w: colW, h: supportH };
        y += supportH + gap;
      } else {
        const count = MACHINES.filter(m=>m.zone===id).length;
        const rows = Math.ceil(count/6);
        const h = 70 + rows*160;
        pos[key] = { x: colX[side], y, w: colW, h };
        y += h + gap;
      }
    });
  });
  return pos;
}
function defaultZoneColors(){
  const colors = {};
  ['A','B','C','R1','R2','R3'].forEach(zk=>{ colors[zk] = '#F5F0DA'; });
  const support = {};
  SUPPORT_ZONES.forEach(z=>{ support[z.id] = '#E9F3EA'; });
  return { zone: colors, support };
}
function defaultCustomAreas(){ return []; }
function currentZoneOf(machineId){
  for(const zk in state.zoneOrder){ if(state.zoneOrder[zk].includes(machineId)) return zk; }
  return null;
}
function moveMachineToZone(machineId, targetZone, beforeMachineId){
  const src = currentZoneOf(machineId);
  if(src){ state.zoneOrder[src] = state.zoneOrder[src].filter(x=>x!==machineId); }
  const arr = state.zoneOrder[targetZone];
  if(beforeMachineId && arr.includes(beforeMachineId)){
    arr.splice(arr.indexOf(beforeMachineId), 0, machineId);
  } else {
    arr.push(machineId);
  }
}
function findBlockItem(itemKey){
  for(const side of ['L','R']){
    const idx = state.blockItems[side].indexOf(itemKey);
    if(idx>=0) return {side, idx};
  }
  return null;
}
function allRegionKeys(){
  return [...state.blockItems.L, ...state.blockItems.R, ...state.customAreas.map(c=>'custom:'+c.id)];
}
function bringRegionToFront(itemKey){
  state.regionZOrder = state.regionZOrder.filter(k=>k!==itemKey);
  state.regionZOrder.push(itemKey);
}
function addCustomArea(){
  const n = state.customAreas.length+1;
  const id = 'area'+Date.now();
  state.customAreas.push({ id, label: T('พื้นที่ใหม่ ','New Area ')+n, color:'#FBEEE1' });
  const offset = (state.customAreas.length%6)*20;
  state.regionPos['custom:'+id] = { x:40+offset, y:40+offset, w:260, h:140 };
  renderFloorTab();
}
function removeCustomArea(id){
  if(!confirm(T('ลบพื้นที่นี้?','Delete this area?'))) return;
  state.customAreas = state.customAreas.filter(c=>c.id!==id);
  delete state.regionPos['custom:'+id];
  renderFloorTab();
}
function removeSupportZone(zoneId){
  const z = SUPPORT_ZONES.find(x=>x.id===zoneId);
  if(!z) return;
  const occupants = workersCoveringSlot(zoneId);
  const label = state.labels.support[zoneId];
  let msg = T('ลบพื้นที่ "'+label+'" ออกจากผัง?','Remove "'+label+'" from the layout?');
  if(occupants.length>0){
    msg = T(
      'พื้นที่ "'+label+'" ยังมีคนอยู่ '+occupants.length+' คน — ระบบจะย้ายคนกลับไปคลังพนักงานก่อน แล้วค่อยลบพื้นที่นี้ ดำเนินการต่อไหม?',
      '"'+label+'" still has '+occupants.length+' people assigned — they will be moved back to the employee pool before removing this area. Continue?'
    );
  }
  if(!confirm(msg)) return;
  occupants.forEach(w=>removeSlotFromWorker(w.id, zoneId));
  state.blockItems.L = state.blockItems.L.filter(k=>k!=='support:'+zoneId);
  state.blockItems.R = state.blockItems.R.filter(k=>k!=='support:'+zoneId);
  delete state.regionPos['support:'+zoneId];
  renderTabs();
}

/* ---------- derived ---------- */
function isMachineSlot(id){ return MACHINES.some(m=>m.id===id); }
function isDecommissioned(machineId){ return state.machineMeta[machineId].decommission.flag; }
function machineWeeklyShiftTotal(machineId){
  if(isDecommissioned(machineId)) return 0;
  return DAY_KEYS.reduce((a,d)=>a+state.plan[machineId][d],0);
}
function operatorsFor(machineId){ return state.workers.filter(w=>w.slots.includes(machineId)); }
function workersCoveringSlot(slotId){ return state.workers.filter(w=>w.slots.includes(slotId)); }
function machineStatus(machineId){
  if(isDecommissioned(machineId)) return 'decommissioned';
  const ops = operatorsFor(machineId);
  if(ops.length===0) return 'critical';
  const sharedAny = ops.some(w=>w.slots.length>1);
  return sharedAny ? 'shared' : 'ok';
}
function jigsFor(machineId){ return state.jigs.filter(j=>j.machineId===machineId); }
function unplacedJigs(){ return state.jigs.filter(j=>j.machineId===null); }
function slotLaborType(slotId){
  if(isMachineSlot(slotId)) return 'direct';
  const z = SUPPORT_ZONES.find(x=>x.id===slotId);
  return z ? z.laborType : null;
}
function workerLaborType(w){
  if(!w.slots || w.slots.length===0) return null;
  // if covering any machine, count as direct
  if(w.slots.some(s=>isMachineSlot(s))) return 'direct';
  const types = w.slots.map(slotLaborType).filter(Boolean);
  if(types.includes('direct')) return 'direct';
  if(types.length) return types[0];
  return null;
}
function laborTypeCounts(){
  const counts = { direct:0, indirect:0, unassigned:0 };
  state.workers.forEach(w=>{
    const t = workerLaborType(w);
    if(t==='direct') counts.direct++;
    else if(t==='indirect') counts.indirect++;
    else counts.unassigned++;
  });
  return counts;
}

function addSlotToWorker(workerId, slotId, shift){
  const w = state.workers.find(x=>x.id===workerId);
  if(!w) return;
  if(!w.shiftAssign) w.shiftAssign = {};
  if(w.slots.includes(slotId)){ if(shift) w.shiftAssign[slotId]=shift; return; }
  const isSupport = SUPPORT_ZONES.some(z=>z.id===slotId);
  if(isSupport){ w.slots = [slotId]; w.shiftAssign = {}; return; }
  w.slots = w.slots.filter(s=>!SUPPORT_ZONES.some(z=>z.id===s));
  if(w.slots.length>=MAX_MACHINES_PER_WORKER) return;
  w.slots.push(slotId);
  w.shiftAssign[slotId] = shift || 'day';
}
function removeSlotFromWorker(workerId, slotId){
  const w = state.workers.find(x=>x.id===workerId);
  if(!w) return;
  w.slots = w.slots.filter(s=>s!==slotId);
  if(w.shiftAssign) delete w.shiftAssign[slotId];
}
function machineNeedsNightShift(machineId){
  if(isDecommissioned(machineId)) return false;
  return DAY_KEYS.some(d=>state.plan[machineId][d]===2);
}
function operatorsForShift(machineId, shift){
  return state.workers.filter(w=>w.slots.includes(machineId) && (w.shiftAssign&&w.shiftAssign[machineId]||'day')===shift);
}
function machineRequiresSaturdayOT(machineId){
  if(isDecommissioned(machineId)) return false;
  return state.plan[machineId]['sat'] > 0;
}

/* ---------- overview / summary ---------- */
function zoneRequirement(){
  const rows = [];
  ['A','B','C','R1','R2','R3'].forEach(zk=>{
    const ids = state.zoneOrder[zk].filter(id=>!isDecommissioned(id));
    if(ids.length===0) return;
    const required = ids.length;
    let coveredCount = 0;
    ids.forEach(id=>{ if(operatorsFor(id).length>0) coveredCount++; });
    rows.push({ key:zk, label: state.labels.zone[zk], type:'zone', laborType:'direct', required, assigned: coveredCount, gap: required - coveredCount });
  });
  SUPPORT_ZONES.forEach(z=>{
    const required = z.baseReq;
    const assigned = workersCoveringSlot(z.id).length;
    rows.push({ key:z.id, label: state.labels.support[z.id], type:'support', laborType:z.laborType, required, assigned, gap: required-assigned });
  });
  return rows;
}
function overviewSummary(){
  const rows = zoneRequirement();
  const totalRequired = rows.reduce((a,r)=>a+r.required,0);
  const totalWorkers = state.workers.length;
  const shortage = Math.max(0, totalRequired - totalWorkers);
  const surplus = Math.max(0, totalWorkers - totalRequired);
  return { rows, totalRequired, totalWorkers, shortage, surplus };
}

/* ============================================================
   EDITABLE LABEL HELPER
   ============================================================ */
function editableLabel(getVal, setVal, extraStyle){
  const span = document.createElement('span');
  span.className = 'editable-label';
  if(extraStyle) span.style.cssText = extraStyle;
  span.textContent = getVal();
  span.title = T('คลิกเพื่อแก้ไข','Click to edit');
  span.addEventListener('click', (e)=>{
    e.stopPropagation();
    const input = document.createElement('input');
    input.type='text'; input.value = getVal();
    span.replaceWith(input);
    input.focus(); input.select();
    function commit(){
      setVal(input.value.trim() || getVal());
      input.replaceWith(span);
      span.textContent = getVal();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') input.blur(); if(ev.key==='Escape'){ input.value=getVal(); input.blur(); } });
    input.addEventListener('click', ev=>ev.stopPropagation());
  });
  return span;
}

function buildAvatarChip(w, opts){
  opts = opts || {};
  const chip = document.createElement('div');
  chip.className = 'avatar-chip' + (opts.tiny?' tiny':'') + (opts.assignedInstance?' assigned-instance':'') + (opts.dimmed?' chip-dimmed':'') + (opts.isRelief?' chip-relief':'');
  chip.dataset.workerId = w.id;
  if(state.selectedChip===w.id) chip.classList.add('selected');
  const ring = BREAK_GROUPS[w.breakGroup] ? BREAK_GROUPS[w.breakGroup].color : '#999';
  chip.innerHTML = `
    <span class="avatar-circle" style="background:${w.color};border-color:${ring};">${avatarSvg(w.avatar)}</span>
    <span class="aname">${w.name}</span>
    ${(!opts.assignedInstance && w.slots.length>0) ? `<span class="acount">×${w.slots.length}</span>` : ''}
    ${opts.dimmed ? `<span class="chip-tag">${T('พัก','Break')}</span>` : ''}
    ${opts.isRelief ? `<span class="chip-tag relief">${T('สลับเบรก','Relief')}</span>` : ''}
    ${(!opts.assignedInstance) ? `<button type="button" class="chip-settings-btn" title="${T('ตั้งชื่อ/กลุ่มพัก','Set name/break group')}">⚙</button>` : ''}
  `;
  if(opts.assignedInstance){
    if(opts.isRelief){
      chip.title = T('กำลังสลับเบรกให้เครื่องนี้ — คลิกเพื่อดูรายละเอียด','Currently on relief duty here — click for details');
      chip.addEventListener('click', (e)=>{ e.stopPropagation(); openWorkerPanel(w.id); });
    } else {
      chip.title = T('คลิกเพื่อถอนออกจากตำแหน่งนี้','Click to remove from this position');
      chip.addEventListener('click', (e)=>{ e.stopPropagation(); removeSlotFromWorker(w.id, opts.slotId); renderTabs(); });
    }
  } else {
    chip.addEventListener('pointerdown', onAvatarPointerDown);
    const gearBtn = chip.querySelector('.chip-settings-btn');
    gearBtn.addEventListener('pointerdown', e=>e.stopPropagation());
    gearBtn.addEventListener('click', (e)=>{ e.stopPropagation(); e.preventDefault(); openWorkerPanel(w.id); });
  }
  return chip;
}
function renderRosterInto(container){
  container.innerHTML='';
  let workers = state.workers.slice();
  // department filter
  if(state.rosterFilterDept && state.rosterFilterDept!=='all'){
    workers = workers.filter(w=>{
      const lt = workerLaborType(w);
      if(state.rosterFilterDept==='unassigned') return !lt;
      return lt===state.rosterFilterDept;
    });
  }
  workers.sort((a,b)=> (b.slots.length-a.slots.length) || a.id.localeCompare(b.id));

  const groupKeysToShow = state.rosterFilterGroup && state.rosterFilterGroup!=='all'
    ? [state.rosterFilterGroup]
    : [...BREAK_GROUP_ORDER, 'none'];

  groupKeysToShow.forEach(gk=>{
    const groupWorkers = workers.filter(w=> gk==='none' ? !w.breakGroup : w.breakGroup===gk);
    if(groupWorkers.length===0) return;
    const section = document.createElement('div');
    section.className = 'roster-group-section';
    const header = document.createElement('div');
    header.className = 'roster-group-header';
    if(gk==='none'){
      header.innerHTML = `<span class="rg-dot" style="background:#B0B6BB;"></span>${T('ไม่ระบุกลุ่มพัก','No break group')} <span class="rg-count">${groupWorkers.length}</span>`;
    } else {
      const grp = BREAK_GROUPS[gk];
      header.innerHTML = `<span class="rg-dot" style="background:${grp.color};"></span>${breakGroupLabel(gk)} <span class="rg-count">${groupWorkers.length}</span>`;
    }
    section.appendChild(header);
    const grid = document.createElement('div');
    grid.className = 'slot-drop roster-group-grid';
    groupWorkers.forEach(w=>{
      const chip = buildAvatarChip(w,{});
      const lt = workerLaborType(w);
      const deptTag = document.createElement('span');
      deptTag.className = 'chip-dept-tag '+(lt||'none');
      deptTag.textContent = lt==='direct' ? T('D','D') : (lt==='indirect' ? T('I','I') : T('—','—'));
      deptTag.title = lt==='direct' ? T('Direct','Direct') : (lt==='indirect' ? T('Indirect','Indirect') : T('ยังไม่จัดตำแหน่ง','Unassigned'));
      chip.appendChild(deptTag);
      grid.appendChild(chip);
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
  if(container.children.length===0){
    container.innerHTML = `<div class="hint" style="padding:10px;">${T('ไม่มีพนักงานตรงตามตัวกรอง','No employees match the filter')}</div>`;
  }
}
function renderAssignedInto(container, slotId, tiny, shift){
  container.innerHTML='';
  let workers = workersCoveringSlot(slotId);
  if(shift){ workers = workers.filter(w=> (w.shiftAssign&&w.shiftAssign[slotId]||'day')===shift); }
  workers.forEach(w=>{
    const isLeaving = state.breakModeActive && w.reliefFor && w.reliefFor!==slotId;
    container.appendChild(buildAvatarChip(w,{tiny:tiny!==false, assignedInstance:true, slotId, dimmed:isLeaving}));
  });
  if(state.breakModeActive && shift!=='night'){
    const relievers = state.workers.filter(w=>w.reliefFor===slotId && !workers.includes(w));
    relievers.forEach(rw=>{
      container.appendChild(buildAvatarChip(rw,{tiny:tiny!==false, assignedInstance:true, slotId, isRelief:true}));
    });
  }
}

let avDrag = null;
function onAvatarPointerDown(e){
  e.preventDefault();
  const chip = e.currentTarget;
  const hitCircle = !!e.target.closest('.avatar-circle');
  avDrag = { workerId:chip.dataset.workerId, startX:e.clientX, startY:e.clientY, moved:false, ghostEl:null, sourceEl:chip, hitCircle };
  window.addEventListener('pointermove', onAvatarPointerMove);
  window.addEventListener('pointerup', onAvatarPointerUp, {once:true});
}
function onAvatarPointerMove(e){
  if(!avDrag) return;
  const dx=e.clientX-avDrag.startX, dy=e.clientY-avDrag.startY;
  if(!avDrag.moved && Math.hypot(dx,dy)>6){
    avDrag.moved = true;
    const ghost = avDrag.sourceEl.cloneNode(true);
    ghost.classList.add('chip-ghost-avatar');
    document.body.appendChild(ghost);
    avDrag.ghostEl = ghost;
    avDrag.sourceEl.classList.add('dragging');
  }
  if(avDrag.moved && avDrag.ghostEl){
    avDrag.ghostEl.style.left=e.clientX+'px';
    avDrag.ghostEl.style.top=e.clientY+'px';
    updateSlotHover(e.clientX,e.clientY,'[data-machine-drop],[data-support-drop]');
  }
}
function updateSlotHover(x,y,selector){
  document.querySelectorAll(selector).forEach(el=>el.classList.remove('dragover'));
  const el = document.elementFromPoint(x,y);
  const target = el && el.closest(selector);
  if(target) target.classList.add('dragover');
}
function onAvatarPointerUp(e){
  window.removeEventListener('pointermove', onAvatarPointerMove);
  if(!avDrag) return;
  const ctx = avDrag; avDrag=null;
  if(ctx.ghostEl) ctx.ghostEl.remove();
  ctx.sourceEl && ctx.sourceEl.classList.remove('dragging');
  document.querySelectorAll('[data-machine-drop],[data-support-drop]').forEach(el=>el.classList.remove('dragover'));
  if(!ctx.moved){
    if(ctx.hitCircle){ openWorkerPanel(ctx.workerId); return; }
    state.selectedChip = (state.selectedChip===ctx.workerId) ? null : ctx.workerId;
    renderTabs();
    return;
  }
  const el = document.elementFromPoint(e.clientX,e.clientY);
  const target = el && el.closest('[data-machine-drop],[data-support-drop]');
  if(target){
    const slotId = target.dataset.machineDrop || target.dataset.supportDrop;
    addSlotToWorker(ctx.workerId, slotId, target.dataset.shift);
  }
  renderTabs();
}
function registerMachineDrop(el, machineId, shift){
  el.dataset.machineDrop = machineId;
  if(shift) el.dataset.shift = shift;

    if(e.target.closest('.avatar-chip')) return;

function registerSupportDrop(el, zoneId){

function buildJigTile(j){
  const tile = document.createElement('div');
  tile.className = 'jig-tile';
  tile.dataset.jigId = j.id;
  tile.style.background = j.color;

  if(state.selectedJig===j.id) tile.style.boxShadow = '0 0 0 3px rgba(215,25,32,.4)';
  tile.addEventListener('pointerdown', onJigPointerDown);

function renderJigTrayInto(container){

}
function renderJigSlotInto(container, machineId){

let jigDrag = null;
function onJigPointerDown(e){
  e.preventDefault();
  const tile = e.currentTarget;
  jigDrag = { jigId:tile.dataset.jigId, startX:e.clientX, startY:e.clientY, moved:false, ghostEl:null, sourceEl:tile };
  window.addEventListener('pointermove', onJigPointerMove);
  window.addEventListener('pointerup', onJigPointerUp, {once:true});
}
function onJigPointerMove(e){
  if(!jigDrag) return;
  const dx=e.clientX-jigDrag.startX, dy=e.clientY-jigDrag.startY;
  if(!jigDrag.moved && Math.hypot(dx,dy)>6){
    jigDrag.moved = true;
    const ghost = jigDrag.sourceEl.cloneNode(true);
    ghost.classList.add('chip-ghost-avatar');
    document.body.appendChild(ghost);
    jigDrag.ghostEl = ghost;
    jigDrag.sourceEl.classList.add('dragging');
  }
  if(jigDrag.moved && jigDrag.ghostEl){
    jigDrag.ghostEl.style.left=e.clientX+'px';
    jigDrag.ghostEl.style.top=e.clientY+'px';
    updateSlotHover(e.clientX,e.clientY,'[data-jig-drop]');
  }
}
function onJigPointerUp(e){
  window.removeEventListener('pointermove', onJigPointerMove);
  if(!jigDrag) return;
  const ctx = jigDrag;
  document.querySelectorAll('[data-jig-drop]').forEach(el=>el.classList.remove('dragover'));
  if(ctx.ghostEl) ctx.ghostEl.remove();
  ctx.sourceEl && ctx.sourceEl.classList.remove('dragging');
  if(ctx.moved){
    const el = document.elementFromPoint(e.clientX,e.clientY);
    const target = el && el.closest('[data-jig-drop]');
    const jig = state.jigs.find(j=>j.id===ctx.jigId);
    if(jig){
      if(target) jig.machineId = target.dataset.jigDrop==='TRAY' ? null : target.dataset.jigDrop;
    }
    renderTabs();
  }
  setTimeout(()=>{ jigDrag=null; }, 0);
}
function registerJigDrop(el, machineIdOrTray){
  el.dataset.jigDrop = machineIdOrTray;
  el.addEventListener('click', (e)=>{
    if(e.target.closest('.jig-tile')) return;

      if(jig) jig.machineId = machineIdOrTray==='TRAY' ? null : machineIdOrTray;
      state.selectedJig = null;
      renderTabs();

}

function nextWorkerId(){
  let max=0;
  state.workers.forEach(w=>{ const n=parseInt(w.id.replace('W',''),10); if(n>max) max=n; });
  return 'W'+String(max+1).padStart(2,'0');
}
function createWorker(name){
  const idx = state.workers.length;
  const id = nextWorkerId();
  const w = {
    id, name: name || id, slots: [], role:'operator',
    breakGroup: BREAK_GROUP_ORDER[idx%3],
    avatar: AVATAR_STYLES[idx%AVATAR_STYLES.length],
    color: WORKER_COLOR_PALETTE[idx%WORKER_COLOR_PALETTE.length],
    shiftAssign: {},
    reliefFor: null
  };
  state.workers.push(w);
  return w;
}
function findSlotIdByText(text){
  if(!text) return null;
  const t = String(text).trim().toLowerCase();
  if(!t) return null;
  for(const id in state.labels.machine){ if(state.labels.machine[id].toLowerCase()===t || id.toLowerCase()===t) return id; }
  for(const id in state.labels.support){ if(state.labels.support[id].toLowerCase()===t || id.toLowerCase()===t) return id; }
  // partial/contains match as fallback
  for(const id in state.labels.machine){ if(state.labels.machine[id].toLowerCase().includes(t) || t.includes(id.toLowerCase())) return id; }
  for(const id in state.labels.support){ if(state.labels.support[id].toLowerCase().includes(t)) return id; }
  return null;
}
function handleExcelImport(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('excel-status');
  statusEl.textContent = T('กำลังอ่านไฟล์...','Reading file...'); statusEl.style.color='var(--grey-txt)';
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
      if(rows.length<2){ statusEl.textContent=T('ไม่พบข้อมูลในไฟล์','No data found in file'); statusEl.style.color='var(--red)'; return; }
      const header = rows[0].map(h=>String(h).trim().toLowerCase());
      const nameCol = header.findIndex(h=>h.includes('name')||h.includes('ชื่อ'));
      const sectionCol = header.findIndex(h=>h.includes('section')||h.includes('ส่วนงาน')||h.includes('ตำแหน่ง')||h.includes('machine')||h.includes('เครื่อง'));
      const shiftCol = header.findIndex(h=>h.includes('shift')||h.includes('กะ'));
      if(nameCol<0){ statusEl.textContent=T('ไม่พบคอลัมน์ชื่อ (Name/ชื่อ)','Name column not found (Name/ชื่อ)'); statusEl.style.color='var(--red)'; return; }
      let created=0, updated=0, matched=0, unmatched=0;
      for(let i=1;i<rows.length;i++){
        const row = rows[i];
        const name = row[nameCol] ? String(row[nameCol]).trim() : '';
        if(!name) continue;
        const sectionText = sectionCol>=0 ? String(row[sectionCol]||'').trim() : '';
        const shiftText = shiftCol>=0 ? String(row[shiftCol]||'').trim().toLowerCase() : '';
        const shift = (shiftText.includes('night')||shiftText.includes('คืน')) ? 'night' : 'day';
        let w = state.workers.find(x=>x.name.toLowerCase()===name.toLowerCase());
        if(w){ updated++; } else { w = createWorker(name); created++; }
        if(sectionText){
          const slotId = findSlotIdByText(sectionText);
          if(slotId){ addSlotToWorker(w.id, slotId, shift); matched++; }
          else { unmatched++; }
        }
      }
      const summaryMsg = T(
        `นำเข้าสำเร็จ: เพิ่มใหม่ ${created} คน, อัปเดต ${updated} คน, จับคู่ตำแหน่งได้ ${matched} รายการ${unmatched?`, ไม่พบตำแหน่งที่ตรงกัน ${unmatched} รายการ`:''}`,
        `Import complete: ${created} new, ${updated} updated, ${matched} positions matched${unmatched?`, ${unmatched} unmatched`:''}`
      );
      renderTabs();
      const freshStatusEl = document.getElementById('excel-status');
      if(freshStatusEl){ freshStatusEl.textContent = summaryMsg; freshStatusEl.style.color='var(--green)'; }
    } catch(err){
      statusEl.textContent = T('อ่านไฟล์ไม่สำเร็จ: ','Failed to read file: ')+err.message;
      statusEl.style.color='var(--red)';
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

    state.workers.forEach(w=> wRows.push([w.id, w.name, breakGroupLabel(w.breakGroup), w.slots.map(labelForSlot).join(', '), w.reliefFor?labelForSlot(w.reliefFor):'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wRows), T('พนักงาน','Workers').slice(0,31));

    // Sheet 3: Machines
    const mRows = [[T('เครื่อง','Machine'), T('โซน','Zone'), T('สถานะ','Status'), T('Operator กลางวัน','Day Operator'), T('Operator กลางคืน','Night Operator'), T('กะ/สัปดาห์','Shifts/wk'), T('OT วันเสาร์','Saturday OT'), T('Jig','Jig'), T('ปิด/ย้ายออก','Decommissioned'), T('หมายเหตุ','Note')]];
    MACHINES.forEach(m=>{
      const meta = state.machineMeta[m.id];
      const dayOps = operatorsForShift(m.id,'day').map(o=>o.name).join(', ');
      const nightOps = machineNeedsNightShift(m.id) ? operatorsForShift(m.id,'night').map(o=>o.name).join(', ') : T('ไม่ต้องการ','N/A');
      const jigs = jigsFor(m.id).map(j=>j.name+'('+j.status+')').join(', ');
      mRows.push([state.labels.machine[m.id], state.labels.zone[currentZoneOf(m.id)]||m.zone, machineStatus(m.id), dayOps, nightOps, machineWeeklyShiftTotal(m.id), machineRequiresSaturdayOT(m.id)?T('ใช่','Yes'):T('ไม่','No'), jigs, meta.decommission.flag?T('ใช่','Yes'):T('ไม่','No'), meta.decommission.note||'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mRows), T('เครื่องจักร','Machines').slice(0,31));

    // Sheet 4: Production plan
    const pHeader = [T('เครื่อง','Machine'), ...dayLabelsShort(), T('รวม/สัปดาห์','Total/wk')];
    const pRows = [pHeader];
    MACHINES.forEach(m=>{
      const decom = isDecommissioned(m.id);
      pRows.push([state.labels.machine[m.id], ...DAY_KEYS.map(d=> decom? '-' : state.plan[m.id][d]), decom?0:machineWeeklyShiftTotal(m.id)]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pRows), T('แผนการผลิต','Production Plan').slice(0,31));

    // Sheet 5: Roster / hours
    const rHeader = [T('รหัส','ID'), T('ชื่อ','Name'), T('ตำแหน่ง','Position'), ...dayLabelsShort(), T('รวม ชม./สัปดาห์','Total h/wk'), T('ผ่าน RBA','RBA Pass')];
    const rRows = [rHeader];
    state.workers.filter(w=>w.slots.length>0).forEach(w=>{
      const roster = getRosterFor(w.id);
      let total=0;
      const dayVals = DAY_KEYS.map(d=>{
        const day = roster[d];
        const hrs = day.off?0:(BASE_HOURS_PER_SHIFT+day.ot);
        total += hrs;
        return day.off ? T('หยุด','Off') : hrs.toFixed(2);
      });
      rRows.push([w.id, w.name, w.slots.map(labelForSlot).join(', '), ...dayVals, total.toFixed(2), total<=RBA_WEEKLY_CAP?T('ผ่าน','Pass'):T('ไม่ผ่าน','Fail')]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rRows), T('ตารางเวลาทำงาน','Roster').slice(0,31));

    const fname = 'manpower-simulation-'+new Date().toISOString().slice(0,10)+'.xlsx';
    XLSX.writeFile(wb, fname);
    statusEl.textContent = T('ส่งออกไฟล์แล้ว ✓','File exported ✓');
    statusEl.style.color='var(--green)';
  } catch(err){
    statusEl.textContent = T('ส่งออกไม่สำเร็จ: ','Export failed: ')+err.message;
    statusEl.style.color='var(--red)';
  }
}

const CLOUD_DOC_PATH = { collection:'simulation', doc:'shared' };

let firebaseReady = false;
let isEditor = false;
let currentUserEmail = null;
let applyingRemote = false;
let saveDebounceTimer = null;
let fbDb = null;

function serializeState(){
  const {panelType, panelId, ...rest} = state;
  return JSON.stringify(rest);
}

function initFirebase(){
  if(typeof firebase === 'undefined') return; // SDK failed to load (e.g. offline)
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') return; // not configured yet
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    firebaseReady = true;
    firebase.auth().onAuthStateChanged(user=>{
      isEditor = !!user;
      currentUserEmail = user ? user.email : null;
      renderShell();
      renderTabs();
    });
    startCloudSync();
  } catch(err){
    console.error('Firebase init failed', err);
  }
}
function startCloudSync(){
  if(!fbDb) return;
  fbDb.collection(CLOUD_DOC_PATH.collection).doc(CLOUD_DOC_PATH.doc).onSnapshot(docSnap=>{
    if(!docSnap.exists) return;
    const remote = docSnap.data();
    if(!remote || !remote.data) return;
    applyingRemote = true;
    try{
      const loaded = JSON.parse(remote.data);
      state = { ...state, ...loaded, panelType:null, panelId:null };
      renderShell();
      renderTabs();
    } catch(err){ console.error('apply remote state failed', err); }
    finally { applyingRemote = false; }
  }, err=>console.error('cloud sync listener error', err));
}
function scheduleCloudSave(){
  if(!firebaseReady || !isEditor || applyingRemote || !fbDb) return;
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{
    fbDb.collection(CLOUD_DOC_PATH.collection).doc(CLOUD_DOC_PATH.doc).set({
      data: serializeState(), updatedAt: Date.now(), updatedBy: currentUserEmail||'unknown'
    }).catch(err=>console.error('cloud save failed', err));
  }, 800);
}

  `;
  document.getElementById('lg-close').addEventListener('click', closePanel);

    if(!email||!pw){ statusEl.textContent=T('กรอกอีเมลและรหัสผ่าน','Enter email and password'); statusEl.style.color='var(--red)'; return; }

function labelForSlot(slotId){
  if(state.labels.machine[slotId]) return state.labels.machine[slotId];
  if(state.labels.support[slotId]) return state.labels.support[slotId];
  return slotId;
}

function setCanvasZoom(z){
  state.canvasZoom = Math.max(0.3, Math.min(1.5, Math.round(z*10)/10));
  const label = document.getElementById('zoom-pct-label');
  if(label) label.textContent = Math.round(state.canvasZoom*100)+'%';
  applyCanvasZoom();
}
function applyCanvasZoom(){
  const inner = document.getElementById('factory-canvas-inner');
  const sizer = document.getElementById('factory-canvas-sizer');
  if(!inner || !sizer) return;
  const natW = parseFloat(inner.dataset.natW||0), natH = parseFloat(inner.dataset.natH||0);
  const z = state.canvasZoom;
  inner.style.transform = 'scale('+z+')';
  sizer.style.width = (natW*z)+'px';
  sizer.style.height = (natH*z)+'px';
}

function buildCanvas(){
  const canvas = document.getElementById('factory-canvas-inner');
  if(!canvas) return;
  // canvas height = tallest bottom edge + margin
  let maxBottom = 400, maxRight = 800;
  allRegionKeys().forEach(k=>{
    const p = state.regionPos[k];
    if(p){ maxBottom = Math.max(maxBottom, p.y+p.h); maxRight = Math.max(maxRight, p.x+p.w); }
  });
  canvas.style.height = (maxBottom+30)+'px';
  canvas.style.width = (maxRight+30)+'px';
  canvas.dataset.natW = maxRight+30;
  canvas.dataset.natH = maxBottom+30;

  // paint in z-order (state.regionZOrder), append any missing keys at the end
  const keys = allRegionKeys();
  const order = state.regionZOrder.filter(k=>keys.includes(k));
  keys.forEach(k=>{ if(!order.includes(k)) order.push(k); });
  state.regionZOrder = order;

  order.forEach((itemKey,zi)=>{
    const [kind,id] = itemKey.split(':');
    let regionEl;
    if(kind==='support'){
      const z = SUPPORT_ZONES.find(x=>x.id===id);
      if(!z) return;
      regionEl = renderSupportTile(z);
    } else if(kind==='custom'){
      const area = state.customAreas.find(a=>a.id===id);
      if(!area) return;
      regionEl = renderCustomAreaBox(area);
    } else {
      regionEl = renderZoneBoxByKey(id);
    }
    regionEl.classList.add('region-item');
    regionEl.dataset.itemKey = itemKey;
    const pos = state.regionPos[itemKey] || {x:20,y:20,w:300,h:120};
    regionEl.style.position='absolute';
    regionEl.style.left = pos.x+'px';
    regionEl.style.top = pos.y+'px';
    regionEl.style.width = pos.w+'px';
    regionEl.style.minHeight = pos.h+'px';
    regionEl.style.zIndex = 10+zi;

    const handle = document.createElement('div');
    handle.className='region-drag-handle';
    handle.title=T('ลากเพื่อย้ายตำแหน่งพื้นที่นี้ (วางซ้อนทับได้อิสระ)','Drag to move this area (free overlap allowed)');
    handle.textContent='⠿⠿';
    handle.addEventListener('pointerdown', onRegionPointerDown);
    regionEl.insertBefore(handle, regionEl.firstChild);

    regionEl.addEventListener('mousedown', ()=>{ bringRegionToFront(itemKey); regionEl.style.zIndex = 999; });

    // persist manual CSS resize (native browser resize handle) via ResizeObserver
    if(window.ResizeObserver){
      const ro = new ResizeObserver(entries=>{
        const p = state.regionPos[itemKey];
        if(!p) return;
        const w = Math.round(entries[0].contentRect.width);
        const h = Math.round(entries[0].contentRect.height);
        if(w>20 && h>20){ p.w=w; p.h=h; }
      });
      ro.observe(regionEl);
    }

    canvas.appendChild(regionEl);
  });
  applyCanvasZoom();
}

/* ---- region (support tile / zone box) FREE drag: absolute reposition, overlap allowed ---- */
let regionDrag = null;
function onRegionPointerDown(e){
  e.preventDefault(); e.stopPropagation();
  const region = e.currentTarget.closest('.region-item');
  const itemKey = region.dataset.itemKey;
  bringRegionToFront(itemKey);
  region.style.zIndex = 999;
  const pos = state.regionPos[itemKey];
  regionDrag = { itemKey, startX:e.clientX, startY:e.clientY, origX:pos.x, origY:pos.y, sourceEl:region };
  window.addEventListener('pointermove', onRegionPointerMove);
  window.addEventListener('pointerup', onRegionPointerUp, {once:true});
}
function onRegionPointerMove(e){
  if(!regionDrag) return;
  const z = state.canvasZoom || 1;
  const dx=(e.clientX-regionDrag.startX)/z, dy=(e.clientY-regionDrag.startY)/z;
  const pos = state.regionPos[regionDrag.itemKey];
  pos.x = Math.max(0, regionDrag.origX+dx);
  pos.y = Math.max(0, regionDrag.origY+dy);
  regionDrag.sourceEl.style.left = pos.x+'px';
  regionDrag.sourceEl.style.top = pos.y+'px';
}
function onRegionPointerUp(){
  window.removeEventListener('pointermove', onRegionPointerMove);
  if(!regionDrag) return;
  regionDrag = null;
  // extend canvas height if needed, no full rebuild required
  const canvas = document.getElementById('factory-canvas');
  let maxBottom = 400;
  allRegionKeys().forEach(k=>{ const p=state.regionPos[k]; if(p) maxBottom=Math.max(maxBottom,p.y+p.h); });
  if(canvas) canvas.style.height = (maxBottom+30)+'px';
}

  if(decom){

    tile.appendChild(x);
  }

  renderJigSlotInto(jigSlot, m.id);
  registerJigDrop(jigSlot, m.id);
  return tile;
}

/* ---- machine tile drag (reposition / move zone) ---- */
let tileDrag = null;
function onTilePointerDown(e){
  e.preventDefault(); e.stopPropagation();
  const tile = e.currentTarget.closest('.machine-tile');
  tileDrag = { machineId: tile.dataset.machineTileId, startX:e.clientX, startY:e.clientY, moved:false, ghostEl:null, sourceEl:tile };
  window.addEventListener('pointermove', onTilePointerMove);
  window.addEventListener('pointerup', onTilePointerUp, {once:true});
}
function onTilePointerMove(e){
  if(!tileDrag) return;
  const dx=e.clientX-tileDrag.startX, dy=e.clientY-tileDrag.startY;
  if(!tileDrag.moved && Math.hypot(dx,dy)>6){
    tileDrag.moved = true;
    const ghost = tileDrag.sourceEl.cloneNode(true);
    ghost.style.cssText='position:fixed;pointer-events:none;z-index:999;opacity:.85;width:112px;';
    document.body.appendChild(ghost);
    tileDrag.ghostEl = ghost;
    tileDrag.sourceEl.style.opacity='.3';
  }
  if(tileDrag.moved && tileDrag.ghostEl){
    tileDrag.ghostEl.style.left=e.clientX+'px';
    tileDrag.ghostEl.style.top=e.clientY+'px';
    document.querySelectorAll('.zone-machines').forEach(el=>el.classList.remove('dragover'));
    document.querySelectorAll('.machine-tile').forEach(el=>el.classList.remove('drop-target-hover'));
    const el = document.elementFromPoint(e.clientX,e.clientY);
    const zoneTarget = el && el.closest('.zone-machines');
    const tileTarget = el && el.closest('.machine-tile');
    if(tileTarget) tileTarget.classList.add('drop-target-hover');
    else if(zoneTarget) zoneTarget.classList.add('dragover');
  }
}
function onTilePointerUp(e){
  window.removeEventListener('pointermove', onTilePointerMove);
  if(!tileDrag) return;
  const ctx = tileDrag; tileDrag=null;
  if(ctx.ghostEl) ctx.ghostEl.remove();
  if(ctx.sourceEl) ctx.sourceEl.style.opacity='';
  document.querySelectorAll('.zone-machines').forEach(el=>el.classList.remove('dragover'));
  document.querySelectorAll('.machine-tile').forEach(el=>el.classList.remove('drop-target-hover'));
  if(ctx.moved){
    const el = document.elementFromPoint(e.clientX,e.clientY);
    const tileTarget = el && el.closest('.machine-tile');
    const zoneTarget = el && el.closest('.zone-machines');
    if(tileTarget && tileTarget.dataset.machineTileId!==ctx.machineId){
      moveMachineToZone(ctx.machineId, currentZoneOf(tileTarget.dataset.machineTileId), tileTarget.dataset.machineTileId);
      renderFloorTab();
    } else if(zoneTarget){
      moveMachineToZone(ctx.machineId, zoneTarget.dataset.zoneDrop, null);
      renderFloorTab();
    }
  }
}
function registerZoneDrop(el, zoneKey){ el.dataset.zoneDrop = zoneKey; }

  document.getElementById('bulk-all1').addEventListener('click', ()=>{ MACHINES.forEach(m=>DAY_KEYS.forEach(d=>state.plan[m.id][d]=1)); renderPlanTab(); });
  document.getElementById('bulk-weekday2weekend1').addEventListener('click', ()=>{
    MACHINES.forEach(m=>DAY_KEYS.forEach(d=>{ state.plan[m.id][d] = (d==='sat'||d==='sun')?1:2; })); renderPlanTab();
  });
}

/* ============================================================
   TAB 3: SKILL MATRIX
   ============================================================ */
function renderSkillTab(){
  const el = document.getElementById('tab-skill');
  const active = MACHINES.filter(m=>!isDecommissioned(m.id));
  const critical = active.filter(m=>machineStatus(m.id)==='critical');
  const shared = active.filter(m=>machineStatus(m.id)==='shared');
  const ok = active.filter(m=>machineStatus(m.id)==='ok');
  const nightGap = active.filter(m=>machineNeedsNightShift(m.id) && operatorsForShift(m.id,'night').length===0 && operatorsFor(m.id).length>0);
  el.innerHTML = `
    <div class="summary-bar" style="grid-template-columns:repeat(4,1fr);">
      <div class="summary-card"><div class="lbl">${T('ไม่มีคนคุมเลย','No operator at all')}</div><div class="big danger">${critical.length}</div></div>
      <div class="summary-card"><div class="lbl">${T('ขาดคนกะกลางคืน','Missing night operator')}</div><div class="big danger">${nightGap.length}</div></div>
      <div class="summary-card"><div class="lbl">${T('คุมร่วมหลายเครื่อง','Shared coverage')}</div><div class="big amber">${shared.length}</div></div>
      <div class="summary-card"><div class="lbl">${T('มีคนคุมเฉพาะเครื่อง','Dedicated operator')}</div><div class="big ok">${ok.length}</div></div>
    </div>
    <div class="group-label">${T('เครื่องที่ไม่มีคนคุม (วิกฤต)','Machines with no operator (critical)')}</div>
    <div class="station-grid" id="skill-critical"></div>
    <div class="group-label">${T('เครื่องเดิน 2 กะ แต่ขาดคนกะกลางคืน','Runs 2 shifts but missing a night operator')}</div>
    <div class="station-grid" id="skill-nightgap"></div>
    <div class="group-label">${T('เครื่องที่คุมร่วมกับเครื่องอื่น (Single-Person Risk)','Machines sharing an operator (single-person risk)')}</div>
    <div class="station-grid" id="skill-shared"></div>
    <div class="group-label">${T('เครื่องที่มีคนคุมเฉพาะ','Machines with dedicated operator')}</div>
    <div class="station-grid" id="skill-ok"></div>
  `;
  fillRiskGrid('skill-critical', critical, 'critical');
  fillRiskGrid('skill-nightgap', nightGap, 'nightgap');
  fillRiskGrid('skill-shared', shared, 'shared');
  fillRiskGrid('skill-ok', ok, 'ok');
}
function fillRiskGrid(containerId, machines, kind){
  const grid = document.getElementById(containerId);
  if(machines.length===0){ grid.innerHTML = `<div class="hint" style="padding:6px 2px;">— ${T('ไม่มี','None')} —</div>`; return; }
  machines.forEach(m=>{
    const worker = operatorsFor(m.id)[0];
    let txt = '';
    if(kind==='critical') txt = T('ยังไม่ได้จัดคนดูแล','Not yet assigned');
    else if(kind==='nightgap'){
      const dayOp = operatorsForShift(m.id,'day')[0];
      txt = dayOp ? T('มีคนกะวัน ('+dayOp.name+') แต่ไม่มีคนกะคืน','Has day operator ('+dayOp.name+') but no night operator') : T('ไม่มีคนกะคืน','No night operator');
    }
    else if(kind==='shared') txt = worker ? `${worker.name} ${T('ดูแลร่วมกับ','also covers')} ${worker.slots.filter(x=>x!==m.id).map(labelForSlot).join(', ')}` : '-';
    else txt = worker ? `${worker.name} ${T('ดูแลเครื่องนี้เพียงเครื่องเดียว','covers only this machine')}` : '-';
    const card = document.createElement('div');
    card.className = 'risk-card'+(kind!=='ok'?' spof':'');
    const kindLabel = kind==='critical'?T('วิกฤต','Critical'):(kind==='nightgap'?T('ขาดกะคืน','Night gap'):(kind==='shared'?T('เสี่ยง','At risk'):T('ปกติ','Normal')));
    card.innerHTML = `<div class="mname">${state.labels.machine[m.id]}</div><div class="rtxt">${txt}</div>
      <div style="margin-top:6px;"><span class="status-pill ${kind==='nightgap'?'critical':kind}">${kindLabel}</span></div>`;
    grid.appendChild(card);
  });
}


/* ============================================================
   TAB 4: ตารางเวลาทำงาน
   ============================================================ */
function parseDateLocal(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDM(dt){ return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0'); }
function weekDates(weekStartStr){
  const start = parseDateLocal(weekStartStr);
  return DAY_KEYS.map((k,i)=>{ const d=new Date(start); d.setDate(start.getDate()+i); return d; });
}
function getRosterFor(workerId){
  if(!state.roster[workerId]){
    const days = {};
    DAY_KEYS.forEach(d=>{ days[d] = { off: d==='sun', ot: 0 }; });
    state.roster[workerId] = days;
  }
  return state.roster[workerId];
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }

function renderRosterTab(){
  const el = document.getElementById('tab-roster');
  const dates = weekDates(state.weekStart);
  const assigned = state.workers.filter(w=>w.slots.length>0);
  let passCount=0, failCount=0;
  const cardsHtml = assigned.map(w=>{
    const roster = getRosterFor(w.id);
    let total=0;
    const grp = BREAK_GROUPS[w.breakGroup];
    const dayCells = DAY_KEYS.map((d,i)=>{
      const day = roster[d];
      const hrs = day.off ? 0 : (BASE_HOURS_PER_SHIFT+day.ot);
      total += hrs;
      return `
        <div class="wwc-day ${day.off?'off':''}">
          <div class="lbl">${dayLabelsShort()[i]} ${fmtDM(dates[i])}</div>
          ${day.off ? `<div class="basehr">${T('หยุด','Off')}</div>` :
            `<div class="basehr">${BASE_HOURS_PER_SHIFT.toFixed(2)} ${T('ชม.','h')}</div>
             <div class="otwrap">OT <input type="number" min="0" max="${MAX_OT_PER_DAY}" step="0.5" value="${day.ot}" data-worker="${w.id}" data-day="${d}" class="ot-input"></div>`}
          <div class="daytot">${hrs.toFixed(2)}h</div>
          <label style="display:block;margin-top:3px;font-size:8.5px;color:var(--grey-txt);">
            <input type="checkbox" data-off-worker="${w.id}" data-off-day="${d}" ${day.off?'checked':''} style="transform:scale(.8);"> ${T('หยุด','Off')}
          </label>
        </div>`;
    }).join('');
    const pass = total<=RBA_WEEKLY_CAP;
    if(pass) passCount++; else failCount++;
    return `
      <div class="worker-week-card">
        <div class="wwc-head">
          <span style="display:flex;align-items:center;gap:6px;">
            <span class="avatar-circle" style="width:20px;height:20px;background:${w.color};border-color:${grp?grp.color:'#999'};">${avatarSvg(w.avatar)}</span>
            <b>${w.name}</b>
          </span>
          <span class="hint">${w.slots.map(labelForSlot).join(', ')} ${grp?('• '+breakGroupLabel(w.breakGroup)):''}</span>
        </div>
        <div class="wwc-days">${dayCells}</div>
        <div class="wwc-foot">
          <span class="tothrs">${total.toFixed(2)} ${T('ชม./สัปดาห์','h/week')}</span>
          <span class="pass-badge ${pass?'pass':'fail'}">${pass?T('✓ ผ่านเกณฑ์ RBA','✓ Meets RBA'):T('✗ เกิน 60 ชม.','✗ Exceeds 60h')}</span>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="roster-toolbar">
      <label>${T('สัปดาห์เริ่มวันที่','Week starting')}</label>
      <input type="date" id="week-start-input" value="${state.weekStart}">
      <span class="hint">${fmtDM(dates[0])} – ${fmtDM(dates[6])}</span>
    </div>
    <div class="summary-bar" style="grid-template-columns:repeat(3,1fr);">
      <div class="summary-card"><div class="lbl">${T('พนักงานที่จัดกะแล้ว','Employees scheduled')}</div><div class="big">${assigned.length}</div></div>
      <div class="summary-card"><div class="lbl">${T('ผ่านเกณฑ์ RBA','Meet RBA')}</div><div class="big ok">${passCount}</div></div>
      <div class="summary-card"><div class="lbl">${T('เกิน 60 ชม./สัปดาห์','Exceed 60h/week')}</div><div class="big ${failCount?'danger':'ok'}">${failCount}</div></div>
    </div>
    <div class="hint" style="margin-bottom:10px;">${T('สูตร: ทำงานปกติ '+BASE_HOURS_PER_SHIFT+' ชม./วัน (8 ชม. + พักเบรก 35 นาที ตามระบบ RMT Connect) + OT ที่ปรับได้','Formula: normal work '+BASE_HOURS_PER_SHIFT+'h/day (8h + 35min break counted per RMT Connect) + adjustable OT')}</div>
    ${cardsHtml || `<div class="hint">${T('ยังไม่มีพนักงานที่จัดตำแหน่งในแท็บ "ผังโรงงาน"','No employees assigned yet in the "Floor Plan" tab')}</div>`}
  `;
  document.getElementById('week-start-input').addEventListener('change', e=>{ state.weekStart=e.target.value; renderRosterTab(); });
  el.querySelectorAll('.ot-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const r=getRosterFor(e.target.dataset.worker);
      r[e.target.dataset.day].ot = clamp(parseFloat(e.target.value)||0,0,MAX_OT_PER_DAY);
      renderRosterTab();
    });
  });
  el.querySelectorAll('[data-off-worker]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const r=getRosterFor(e.target.dataset.offWorker);
      r[e.target.dataset.offDay].off = e.target.checked;
      renderRosterTab();
    });
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  state = freshState();
  renderShell();
  renderTabs();
  initFirebase();
}
document.addEventListener('DOMContentLoaded', init);

})();

</script>
